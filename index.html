<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VSE-270-COM · 60 Practicals</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0c10;
    --card: #13141a;
    --border: #1e2030;
    --accent: #f0c040;
    --accent2: #3de8a0;
    --text: #e8e8f0;
    --muted: #6b6d80;
    --done: #1a2e20;
    --done-border: #3de8a0;
    --tag-html: #e34c26;
    --tag-css: #264de4;
    --tag-js: #f7df1e;
    --tag-php: #777bb4;
    --tag-bootstrap: #7952b3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; }

  /* HEADER */
  header {
    padding: 32px 24px 0;
    max-width: 900px;
    margin: 0 auto;
  }
  .logo { font-size: 11px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  h1 { font-size: clamp(22px, 5vw, 36px); font-weight: 800; line-height: 1.1; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 6px; }

  /* PROGRESS */
  .progress-bar-wrap { margin: 20px 0 0; background: var(--border); border-radius: 4px; height: 6px; }
  .progress-bar-fill { height: 6px; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 4px; transition: width 0.4s ease; }
  .progress-text { font-size: 12px; color: var(--muted); margin-top: 6px; font-family: 'JetBrains Mono', monospace; }

  /* FILTERS */
  .filters {
    max-width: 900px;
    margin: 20px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .filter-btn.active, .filter-btn:hover { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .filter-btn.html.active { background: var(--tag-html); border-color: var(--tag-html); }
  .filter-btn.css.active { background: var(--tag-css); border-color: var(--tag-css); }
  .filter-btn.js.active { background: var(--tag-js); border-color: var(--tag-js); color: #111; }
  .filter-btn.php.active { background: var(--tag-php); border-color: var(--tag-php); }
  .filter-btn.bootstrap.active { background: var(--tag-bootstrap); border-color: var(--tag-bootstrap); }

  /* SEARCH */
  .search-wrap { max-width: 900px; margin: 12px auto 0; padding: 0 24px; }
  .search-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  /* GRID */
  .grid { max-width: 900px; margin: 20px auto 60px; padding: 0 24px; display: flex; flex-direction: column; gap: 10px; }

  /* CARD */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: #2e3050; }
  .card.done { border-color: var(--done-border); background: var(--done); }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }
  .card-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 28px;
  }
  .card-title { flex: 1; font-size: 14px; font-weight: 400; line-height: 1.4; }
  .card.done .card-title { color: var(--accent2); }

  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag {
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 7px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    font-weight: 700;
  }
  .tag.html { background: #e34c2622; color: #e34c26; border: 1px solid #e34c2640; }
  .tag.css { background: #264de422; color: #7090ff; border: 1px solid #264de440; }
  .tag.js { background: #f7df1e22; color: #f7df1e; border: 1px solid #f7df1e40; }
  .tag.php { background: #777bb422; color: #aaa8e0; border: 1px solid #777bb440; }
  .tag.bootstrap { background: #7952b322; color: #c090ff; border: 1px solid #7952b340; }

  .check-btn {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    font-size: 12px;
  }
  .check-btn:hover { border-color: var(--accent2); }
  .card.done .check-btn { border-color: var(--accent2); background: var(--accent2); color: #0b0c10; }

  .chevron { color: var(--muted); font-size: 12px; transition: transform 0.25s; flex-shrink: 0; }
  .card.open .chevron { transform: rotate(180deg); }

  /* BODY */
  .card-body {
    display: none;
    border-top: 1px solid var(--border);
    padding: 20px 16px;
  }
  .card.open .card-body { display: block; }

  .section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .explanation {
    font-size: 13px;
    color: #b0b0c8;
    line-height: 1.7;
    margin-bottom: 18px;
  }
  .explanation b { color: var(--accent); font-weight: 700; }
  .explanation code {
    background: #1e2030;
    padding: 1px 5px;
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
  }

  pre {
    background: #090a0e;
    border: 1px solid #1a1c2a;
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.7;
    color: #c8cce0;
    margin-bottom: 14px;
    position: relative;
  }
  .copy-btn {
    position: absolute;
    top: 10px; right: 10px;
    background: var(--border);
    border: none;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 4px 9px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .copy-btn:hover { background: var(--accent); color: var(--bg); }

  .key-points { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .kp {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: 12px; color: #8888a8; line-height: 1.5;
  }
  .kp::before { content: "▸"; color: var(--accent); flex-shrink: 0; margin-top: 1px; }

  /* syntax colors */
  .kw { color: #c792ea; }
  .str { color: #c3e88d; }
  .fn { color: #82aaff; }
  .cm { color: #546e7a; font-style: italic; }
  .tag-c { color: #f07178; }
  .attr { color: #ffcb6b; }
  .num { color: #f78c6c; }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .tags { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">VSE-270-COM · Web Development</div>
  <h1>60 Practicals <span>Explained</span></h1>
  <p class="subtitle">Click any card to see explanation + code. Check off what you've learned.</p>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="pbar" style="width:0%"></div></div>
  <div class="progress-text" id="ptext">0 / 60 completed</div>
</header>

<div class="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn html" data-filter="html">HTML</button>
  <button class="filter-btn css" data-filter="css">CSS</button>
  <button class="filter-btn js" data-filter="js">JavaScript</button>
  <button class="filter-btn php" data-filter="php">PHP</button>
  <button class="filter-btn bootstrap" data-filter="bootstrap">Bootstrap</button>
</div>
<div class="search-wrap">
  <input class="search-input" id="searchBox" placeholder="Search practicals..." />
</div>

<div class="grid" id="grid"></div>

<script>
const practicals = [
  {
    id:1, tags:["html"],
    title:"Create an HTML page to display a student resume using headings, paragraphs, and lists.",
    explanation:`A <b>resume page</b> uses structural HTML tags. <code>&lt;h1&gt;</code> for name, <code>&lt;h2&gt;</code> for sections like Education & Skills, <code>&lt;p&gt;</code> for text, <code>&lt;ul&gt;</code>/<code>&lt;li&gt;</code> for bullet lists. No CSS needed — just clean HTML structure.`,
    code:`&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;&lt;title&gt;Student Resume&lt;/title&gt;&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Mayur Patil&lt;/h1&gt;
  &lt;p&gt;Computer Engineering | Pravara Rural Engineering College&lt;/p&gt;
  &lt;hr&gt;

  &lt;h2&gt;Education&lt;/h2&gt;
  &lt;ul&gt;
    &lt;li&gt;B.E. Computer Engineering - 2nd Year&lt;/li&gt;
    &lt;li&gt;HSC - 2022, 85%&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h2&gt;Skills&lt;/h2&gt;
  &lt;ul&gt;
    &lt;li&gt;HTML, CSS, JavaScript&lt;/li&gt;
    &lt;li&gt;Firebase, Node.js&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h2&gt;Projects&lt;/h2&gt;
  &lt;p&gt;OxidelicStream - Personal Streaming Platform&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;`,
    points:["h1–h6 are heading tags (h1 = biggest)", "ul = unordered list, ol = ordered list, li = list item", "hr adds a horizontal dividing line", "p tag is for paragraphs"]
  },
  {
    id:2, tags:["html"],
    title:"Design a web page containing an image gallery, hyperlinks to social media pages, and a timetable using tables.",
    explanation:`Covers three HTML essentials: <b>images</b> (<code>&lt;img src&gt;</code>), <b>links</b> (<code>&lt;a href&gt;</code>), and <b>tables</b> (<code>&lt;table&gt;</code>, <code>&lt;tr&gt;</code>, <code>&lt;td&gt;</code>). Tables are used for grid data like timetables.`,
    code:`&lt;h2&gt;Gallery&lt;/h2&gt;
&lt;img src="photo1.jpg" width="150" alt="Photo 1"&gt;
&lt;img src="photo2.jpg" width="150" alt="Photo 2"&gt;

&lt;h2&gt;Social Media&lt;/h2&gt;
&lt;a href="https://instagram.com" target="_blank"&gt;Instagram&lt;/a&gt; |
&lt;a href="https://twitter.com" target="_blank"&gt;Twitter&lt;/a&gt;

&lt;h2&gt;Timetable&lt;/h2&gt;
&lt;table border="1"&gt;
  &lt;tr&gt;
    &lt;th&gt;Day&lt;/th&gt;&lt;th&gt;9AM&lt;/th&gt;&lt;th&gt;11AM&lt;/th&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
    &lt;td&gt;Monday&lt;/td&gt;&lt;td&gt;Maths&lt;/td&gt;&lt;td&gt;Physics&lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
    &lt;td&gt;Tuesday&lt;/td&gt;&lt;td&gt;Chemistry&lt;/td&gt;&lt;td&gt;English&lt;/td&gt;
  &lt;/tr&gt;
&lt;/table&gt;`,
    points:["img tag: src = image path, alt = description, width/height to resize","a href = hyperlink, target='_blank' opens in new tab","table > tr (row) > th (header cell) or td (data cell)","border='1' adds visible table borders"]
  },
  {
    id:3, tags:["html"],
    title:"Create an online feedback form with fields for username, phone number, course selection, comments, and submit button.",
    explanation:`<b>HTML Forms</b> collect user input. Key tags: <code>&lt;form&gt;</code>, <code>&lt;input&gt;</code>, <code>&lt;select&gt;</code>, <code>&lt;textarea&gt;</code>, <code>&lt;button&gt;</code>. Each input has a <code>type</code> attribute (text, tel, email...).`,
    code:`&lt;form action="submit.php" method="POST"&gt;
  &lt;label&gt;Username:&lt;/label&gt;&lt;br&gt;
  &lt;input type="text" name="username" required&gt;&lt;br&gt;

  &lt;label&gt;Phone:&lt;/label&gt;&lt;br&gt;
  &lt;input type="tel" name="phone"&gt;&lt;br&gt;

  &lt;label&gt;Course:&lt;/label&gt;&lt;br&gt;
  &lt;select name="course"&gt;
    &lt;option&gt;Computer Engineering&lt;/option&gt;
    &lt;option&gt;IT&lt;/option&gt;
    &lt;option&gt;Mechanical&lt;/option&gt;
  &lt;/select&gt;&lt;br&gt;

  &lt;label&gt;Comments:&lt;/label&gt;&lt;br&gt;
  &lt;textarea name="comments" rows="4" cols="30"&gt;&lt;/textarea&gt;&lt;br&gt;

  &lt;button type="submit"&gt;Submit Feedback&lt;/button&gt;
&lt;/form&gt;`,
    points:["input type='text' for names, type='tel' for phone numbers","select + option creates a dropdown","textarea is for multi-line text input","required attribute makes the field mandatory","method='POST' sends data securely in request body"]
  },
  {
    id:4, tags:["css"],
    title:"Apply CSS styles using internal, external, and inline methods to design a navigation menu and styled buttons.",
    explanation:`CSS has <b>3 ways</b> to apply styles: <b>Inline</b> (style attr on element), <b>Internal</b> (&lt;style&gt; tag in &lt;head&gt;), <b>External</b> (separate .css file linked with &lt;link&gt;). Priority: Inline &gt; Internal &gt; External.`,
    code:`&lt;!-- INLINE --&gt;
&lt;p style="color:red; font-size:16px;"&gt;Inline styled text&lt;/p&gt;

&lt;!-- INTERNAL (in &lt;head&gt;) --&gt;
&lt;style&gt;
  nav { background: #333; padding: 10px; }
  nav a { color: white; margin: 0 10px; text-decoration: none; }
  nav a:hover { color: yellow; }
  .btn { padding: 10px 20px; background: blue; color: white; border: none; border-radius: 5px; cursor: pointer; }
  .btn:hover { background: darkblue; }
&lt;/style&gt;

&lt;!-- HTML --&gt;
&lt;nav&gt;
  &lt;a href="#"&gt;Home&lt;/a&gt;
  &lt;a href="#"&gt;About&lt;/a&gt;
  &lt;a href="#"&gt;Contact&lt;/a&gt;
&lt;/nav&gt;
&lt;button class="btn"&gt;Click Me&lt;/button&gt;

&lt;!-- EXTERNAL: save as style.css --&gt;
&lt;!-- body { font-family: Arial; margin: 0; } --&gt;
&lt;!-- Link it: &lt;link rel="stylesheet" href="style.css"&gt; --&gt;`,
    points:["Inline: style='property:value' directly on the tag","Internal: &lt;style&gt; block inside &lt;head&gt; — scoped to that page","External: separate .css file linked with &lt;link rel='stylesheet'&gt;",":hover pseudo-class for mouse-over effects","border-radius rounds button corners"]
  },
  {
    id:5, tags:["bootstrap"],
    title:"Develop a responsive college website homepage using Bootstrap Navbar, Cards, and Grid System.",
    explanation:`<b>Bootstrap</b> is a CSS framework. Key concepts: <b>Navbar</b> (top navigation), <b>Grid</b> (12-column layout with col-md-4 etc.), <b>Cards</b> (content boxes). Add Bootstrap via CDN link — no install needed.`,
    code:`&lt;!-- Add in &lt;head&gt; --&gt;
&lt;link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"&gt;

&lt;!-- Navbar --&gt;
&lt;nav class="navbar navbar-dark bg-dark"&gt;
  &lt;div class="container"&gt;
    &lt;a class="navbar-brand" href="#"&gt;My College&lt;/a&gt;
    &lt;ul class="navbar-nav flex-row"&gt;
      &lt;li class="nav-item"&gt;&lt;a class="nav-link text-white mx-2" href="#"&gt;Home&lt;/a&gt;&lt;/li&gt;
      &lt;li class="nav-item"&gt;&lt;a class="nav-link text-white mx-2" href="#"&gt;About&lt;/a&gt;&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/nav&gt;

&lt;!-- Grid + Cards --&gt;
&lt;div class="container mt-4"&gt;
  &lt;div class="row"&gt;
    &lt;div class="col-md-4"&gt;
      &lt;div class="card"&gt;
        &lt;div class="card-body"&gt;
          &lt;h5 class="card-title"&gt;Engineering&lt;/h5&gt;
          &lt;p class="card-text"&gt;Computer, Mechanical, Civil&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class="col-md-4"&gt;
      &lt;div class="card"&gt;
        &lt;div class="card-body"&gt;
          &lt;h5 class="card-title"&gt;Admissions&lt;/h5&gt;
          &lt;p class="card-text"&gt;Apply now for 2024-25&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;`,
    points:["Bootstrap grid: container > row > col-md-4 (4 out of 12 columns)","col-md-4 means 3 cards per row on medium screens","navbar-dark bg-dark = dark navbar styling","Cards are content boxes with card, card-body, card-title classes","Bootstrap is responsive by default — no media queries needed"]
  },
  {
    id:6, tags:["js"],
    title:"Write a JavaScript program to validate a registration form including password length, mobile number, and required fields.",
    explanation:`<b>Form validation</b> in JS checks inputs before submission. Use <code>document.getElementById()</code> to get values, check with <code>if</code> conditions, show errors with <code>alert()</code> or DOM manipulation. Return <code>false</code> to stop form submission.`,
    code:`&lt;form onsubmit="return validate()"&gt;
  Name: &lt;input id="name" type="text"&gt;&lt;br&gt;
  Mobile: &lt;input id="mobile" type="text"&gt;&lt;br&gt;
  Password: &lt;input id="pass" type="password"&gt;&lt;br&gt;
  &lt;button type="submit"&gt;Register&lt;/button&gt;
&lt;/form&gt;

&lt;script&gt;
function validate() {
  var name = document.getElementById("name").value;
  var mobile = document.getElementById("mobile").value;
  var pass = document.getElementById("pass").value;

  if (name === "") {
    alert("Name is required!");
    return false;
  }
  if (mobile.length !== 10 || isNaN(mobile)) {
    alert("Enter valid 10-digit mobile number!");
    return false;
  }
  if (pass.length &lt; 8) {
    alert("Password must be at least 8 characters!");
    return false;
  }
  alert("Registration successful!");
  return true;
}
&lt;/script&gt;`,
    points:["onsubmit='return validate()' — returning false stops form submission","document.getElementById('id').value gets the input value",".length checks string/array length","isNaN() returns true if value is NOT a number","Always validate on both client (JS) and server (PHP) side"]
  },
  {
    id:7, tags:["js"],
    title:"Create a web page that changes background color and text dynamically using JavaScript DOM events.",
    explanation:`<b>DOM Events</b> let JS react to user actions. <code>onclick</code>, <code>onmouseover</code> etc. trigger functions. Use <code>document.body.style.backgroundColor</code> to change CSS via JS. DOM = Document Object Model (the page as a JS object).`,
    code:`&lt;h2 id="msg"&gt;Hello!&lt;/h2&gt;
&lt;button onclick="changeRed()"&gt;Red&lt;/button&gt;
&lt;button onclick="changeBlue()"&gt;Blue&lt;/button&gt;
&lt;button onclick="changeGreen()"&gt;Green&lt;/button&gt;

&lt;script&gt;
function changeRed() {
  document.body.style.backgroundColor = "red";
  document.getElementById("msg").innerHTML = "Background is Red!";
}
function changeBlue() {
  document.body.style.backgroundColor = "blue";
  document.getElementById("msg").innerHTML = "Background is Blue!";
}
function changeGreen() {
  document.body.style.backgroundColor = "green";
  document.getElementById("msg").innerHTML = "Background is Green!";
}
&lt;/script&gt;`,
    points:["document.body.style.propertyName changes inline CSS from JS","innerHTML gets/sets HTML content inside an element","onclick is the most common event — fires on button click","You can also use addEventListener('click', fn) — more modern","DOM manipulation is the core of interactive web pages"]
  },
  {
    id:8, tags:["js"],
    title:"Write a JavaScript program to perform arithmetic operations using buttons and functions for a mini calculator.",
    explanation:`A <b>mini calculator</b> uses JS functions for add/subtract/multiply/divide. Get two input values, convert to numbers with <code>parseFloat()</code>, compute, display result. Good practice for functions and DOM interaction.`,
    code:`Num 1: &lt;input id="n1" type="number"&gt;
Num 2: &lt;input id="n2" type="number"&gt;&lt;br&gt;&lt;br&gt;
&lt;button onclick="calc('+')"&gt;+&lt;/button&gt;
&lt;button onclick="calc('-')"&gt;-&lt;/button&gt;
&lt;button onclick="calc('*')"&gt;×&lt;/button&gt;
&lt;button onclick="calc('/')"&gt;÷&lt;/button&gt;
&lt;p id="result"&gt;&lt;/p&gt;

&lt;script&gt;
function calc(op) {
  var a = parseFloat(document.getElementById("n1").value);
  var b = parseFloat(document.getElementById("n2").value);
  var res;
  if (op === '+') res = a + b;
  else if (op === '-') res = a - b;
  else if (op === '*') res = a * b;
  else if (op === '/') {
    if (b === 0) { alert("Cannot divide by zero!"); return; }
    res = a / b;
  }
  document.getElementById("result").innerHTML = "Result: " + res;
}
&lt;/script&gt;`,
    points:["parseFloat() converts string input to decimal number (use parseInt for whole numbers)","Pass the operator as a parameter to reuse one function","Always check division by zero","innerHTML = 'text' updates what's shown on screen","Functions with parameters reduce code repetition"]
  },
  {
    id:9, tags:["php"],
    title:"Design a PHP script to display employee details and current server information.",
    explanation:`PHP runs on the <b>server</b>. Use <code>echo</code> to output HTML. <b>Superglobal $_SERVER</b> contains server info like server name, PHP version, IP address. PHP code goes inside <code>&lt;?php ... ?&gt;</code> tags.`,
    code:`&lt;?php
// Employee details (hardcoded)
$name = "Rahul Sharma";
$dept = "IT Department";
$salary = 45000;

echo "&lt;h2&gt;Employee Details&lt;/h2&gt;";

    id:18, tags:["js"],
    title:"Write a JavaScript program to validate a signup form including password confirmation and age verification.",
    explanation:`Extension of Q6. New checks: <b>password match</b> (compare two fields) and <b>age range</b> (parseInt + comparison). Shows how to chain multiple validations.`,
    code:`&lt;form onsubmit="return validateSignup()"&gt;
  Name: &lt;input id="sname" type="text"&gt;&lt;br&gt;
  Age: &lt;input id="sage" type="number"&gt;&lt;br&gt;
  Password: &lt;input id="spass" type="password"&gt;&lt;br&gt;
  Confirm Password: &lt;input id="sconfirm" type="password"&gt;&lt;br&gt;
  &lt;button type="submit"&gt;Sign Up&lt;/button&gt;
&lt;/form&gt;

&lt;script&gt;
function validateSignup() {
  var name = document.getElementById("sname").value;
  var age = parseInt(document.getElementById("sage").value);
  var pass = document.getElementById("spass").value;
  var confirm = document.getElementById("sconfirm").value;

  if (name === "") { alert("Name required!"); return false; }

  if (isNaN(age) || age &lt; 18 || age &gt; 100) {
    alert("Age must be between 18 and 100!"); return false;
  }
  if (pass.length &lt; 8) {
    alert("Password must be 8+ characters!"); return false;
  }
  if (pass !== confirm) {
    alert("Passwords do not match!"); return false;
  }
  alert("Signup successful!");
  return true;
}
&lt;/script&gt;`,
    points:["parseInt() converts string to integer","Compare two fields with === to check password match","Chain validations with multiple if + return false","isNaN() returns true if the value is Not a Number","Age verification: check both min and max with &&"]
  },

    id:19, tags:["js"],
    title:"Create a web page that uses JavaScript DOM methods to add and remove list items dynamically.",

    code:`&lt;input id="itemInput" placeholder="Enter item"&gt;
&lt;button onclick="addItem()"&gt;Add&lt;/button&gt;
&lt;ul id="myList"&gt;&lt;/ul&gt;

&lt;script&gt;
function addItem() {
  var val = document.getElementById("itemInput").value;
  if (val === "") { alert("Enter something!"); return; }

  var li = document.createElement("li");
  li.innerHTML = val + ' &lt;button onclick="removeItem(this)"&gt;❌&lt;/button&gt;';
  document.getElementById("myList").appendChild(li);
  document.getElementById("itemInput").value = "";
}

function removeItem(btn) {
  var li = btn.parentNode;
  document.getElementById("myList").removeChild(li);
}
&lt;/script&gt;`,
    points:["createElement('tag') creates a new HTML element in memory","appendChild(el) adds it as the last child of a parent","btn.parentNode gets the parent element (the li)","removeChild(el) deletes an element from the DOM","this inside onclick refers to the element that was clicked"]
  },

    id:20, tags:["js"],
    title:"Write a JavaScript program to generate a multiplication table for a given number using functions.",

    code:`Number: &lt;input id="num" type="number"&gt;
&lt;button onclick="generateTable()"&gt;Generate&lt;/button&gt;
&lt;div id="tableOutput"&gt;&lt;/div&gt;

&lt;script&gt;
function generateTable() {
  var n = parseInt(document.getElementById("num").value);
  if (isNaN(n)) { alert("Enter a number!"); return; }

  var output = "&lt;h3&gt;Multiplication Table of " + n + "&lt;/h3&gt;";

}

  {
    id:30, tags:["js"],
    title:"Write a JavaScript program to validate a form for empty fields, password length, and proper email format.",
    explanation:`Email validation uses <b>Regular Expressions (RegEx)</b>. The pattern <code>/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/</code> tests for valid email format using <code>regex.test(email)</code>.`,
    code:`&lt;form onsubmit="return validateForm()"&gt;
  Name: &lt;input id="fname" type="text"&gt;&lt;br&gt;
  Email: &lt;input id="femail" type="text"&gt;&lt;br&gt;
  Password: &lt;input id="fpass" type="password"&gt;&lt;br&gt;
  &lt;button type="submit"&gt;Submit&lt;/button&gt;
&lt;/form&gt;

&lt;script&gt;
function validateForm() {
  var name  = document.getElementById("fname").value.trim();
  var email = document.getElementById("femail").value.trim();
  var pass  = document.getElementById("fpass").value;

  if (name === "") {
    alert("Name cannot be empty!"); return false;
  }
  var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    alert("Invalid email format!"); return false;
  }
  if (pass.length &lt; 8) {
    alert("Password must be at least 8 characters!"); return false;
  }
  alert("Form submitted successfully!");
  return true;
}
&lt;/script&gt;`,
    points:["RegEx /pattern/ tests string patterns","emailRegex.test(str) returns true if pattern matches","^ = start of string, $ = end of string in regex","[^\\s@] = any char that isn't space or @",".trim() removes spaces from start/end of input"]
  },

    id:31, tags:["js"],
    title:"Create a web page that dynamically changes images and text using JavaScript DOM manipulation.",
    explanation:`Image slideshow / content switcher using JS. Change <code>img.src</code> to swap images, change <code>element.innerHTML</code> for text. Can use array to store image paths.`,
    code:`&lt;img id="myImg" src="img1.jpg" width="300"&gt;
&lt;p id="caption"&gt;Image 1 of 3&lt;/p&gt;
&lt;button onclick="prevImg()"&gt;◀ Prev&lt;/button&gt;
&lt;button onclick="nextImg()"&gt;Next ▶&lt;/button&gt;

&lt;script&gt;
var images = ["img1.jpg", "img2.jpg", "img3.jpg"];
var captions = ["Beautiful Sunset", "Mountain View", "Ocean Waves"];
var current = 0;

function nextImg() {
  current = (current + 1) % images.length;
  updateDisplay();
}
function prevImg() {
  current = (current - 1 + images.length) % images.length;
  updateDisplay();
}
function updateDisplay() {
  document.getElementById("myImg").src = images[current];
  document.getElementById("caption").innerHTML =
    captions[current] + " (" + (current+1) + " of " + images.length + ")";
}
&lt;/script&gt;`,
    points:["img.src = 'path' swaps the displayed image","% (modulo) wraps index — goes back to 0 after last","(current - 1 + length) % length handles backwards wrap","Arrays hold related data (image paths, captions)","Keep display logic in one function (updateDisplay) — clean code"]
  },
  {
    id:32, tags:["js"],
    title:"Write a JavaScript program to perform calculator operations (+, −, ×, ÷) using functions and switch-case statements.",
    explanation:`Same as Q8 but using <b>switch-case</b> instead of if-else. Switch is cleaner when checking one variable against many values.`,
    code:`Num1: &lt;input id="c1" type="number"&gt;
Num2: &lt;input id="c2" type="number"&gt;&lt;br&gt;
&lt;button onclick="calc2('+')"&gt;+&lt;/button&gt;
&lt;button onclick="calc2('-')"&gt;-&lt;/button&gt;
&lt;button onclick="calc2('*')"&gt;×&lt;/button&gt;
&lt;button onclick="calc2('/')"&gt;÷&lt;/button&gt;
&lt;p id="calcResult"&gt;&lt;/p&gt;

&lt;script&gt;
function calc2(op) {
  var a = parseFloat(document.getElementById("c1").value);
  var b = parseFloat(document.getElementById("c2").value);
  var result;

  switch(op) {
    case '+': result = a + b; break;
    case '-': result = a - b; break;
    case '*': result = a * b; break;
    case '/':
      if (b === 0) { alert("Division by zero!"); return; }
      result = a / b;
      break;
    default: result = "Invalid operator";
  }
  document.getElementById("calcResult").innerHTML = "Result: " + result;
}
&lt;/script&gt;`,
    points:["switch(variable) { case 'value': ... break; }","break prevents fall-through to next case","default runs if no case matches (like else)","switch is cleaner than if-elseif for single-variable checks","Always handle division by zero separately"]
  },

    id:42, tags:["js"],
    title:"Write a JavaScript program to validate a student login form including email format, password confirmation, and empty field checking.",
    explanation:`Login validation: check email format with regex, password length, and empty fields. Similar to Q30 but in a login context.`,
    code:`&lt;form onsubmit="return loginValidate()"&gt;
  Email: &lt;input id="lemail" type="text"&gt;&lt;br&gt;
  Password: &lt;input id="lpass" type="password"&gt;&lt;br&gt;
  &lt;span id="lerror" style="color:red"&gt;&lt;/span&gt;&lt;br&gt;
  &lt;button type="submit"&gt;Login&lt;/button&gt;
&lt;/form&gt;

&lt;script&gt;
function loginValidate() {
  var email = document.getElementById("lemail").value.trim();
  var pass  = document.getElementById("lpass").value;
  var errEl = document.getElementById("lerror");

  if (email === "" || pass === "") {
    errEl.innerHTML = "⚠️ All fields are required!";
    return false;
  }
  var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailPattern.test(email)) {
    errEl.innerHTML = "⚠️ Invalid email format!";
    return false;
  }
  if (pass.length &lt; 6) {
    errEl.innerHTML = "⚠️ Password must be at least 6 characters!";
    return false;
  }
  errEl.innerHTML = "";
  alert("Login successful!");
  return true;
}
&lt;/script&gt;`,

  {
    id:44, tags:["js"],
    title:"Write a JavaScript program to calculate simple interest, compound interest, and percentage using buttons and functions.",
    explanation:`Mathematical calculations in JS. Formulas: <b>SI</b> = P×R×T/100, <b>CI</b> = P×(1+R/100)^T - P, <b>%</b> = (part/total)×100. Uses <code>Math.pow()</code>.`,
    code:`P: &lt;input id="principal" type="number" placeholder="Principal"&gt;
R: &lt;input id="rate" type="number" placeholder="Rate %"&gt;
T: &lt;input id="time" type="number" placeholder="Time (years)"&gt;&lt;br&gt;&lt;br&gt;
&lt;button onclick="calcSI()"&gt;Simple Interest&lt;/button&gt;
&lt;button onclick="calcCI()"&gt;Compound Interest&lt;/button&gt;
&lt;button onclick="calcPerc()"&gt;Percentage (P of R)&lt;/button&gt;
&lt;p id="finResult"&gt;&lt;/p&gt;

&lt;script&gt;
function getVals() {
  return {
    p: parseFloat(document.getElementById("principal").value),
    r: parseFloat(document.getElementById("rate").value),
    t: parseFloat(document.getElementById("time").value)
  };
}
function calcSI() {
  var v = getVals();
  var si = (v.p * v.r * v.t) / 100;
  document.getElementById("finResult").innerHTML =
    "Simple Interest = Rs. " + si.toFixed(2);
}
function calcCI() {
  var v = getVals();
  var ci = v.p * (Math.pow(1 + v.r/100, v.t)) - v.p;
  document.getElementById("finResult").innerHTML =
    "Compound Interest = Rs. " + ci.toFixed(2);
}
function calcPerc() {
  var v = getVals();
  var perc = (v.p / v.r) * 100;
  document.getElementById("finResult").innerHTML =
    v.p + " is " + perc.toFixed(2) + "% of " + v.r;
}
&lt;/script&gt;`,
    points:["Math.pow(base, exponent) calculates power (e.g., 2^3 = 8)","toFixed(2) rounds to 2 decimal places","Extract repeated logic (getVals) into a helper function","SI = P*R*T/100 | CI = P*(1+R/100)^T - P","Always validate inputs before calculating in real apps"]
  },

  {
    id:54, tags:["js"],
    title:"Write a JavaScript program to validate a feedback form including email validation, comment length, and mandatory field checking.",
    explanation:`Feedback form validation. New concept: check <b>minimum comment length</b> using <code>.length</code> on textarea value. Shows real-world form UX patterns.`,
    code:`&lt;form onsubmit="return validateFeedback()"&gt;
  Name: &lt;input id="fbname" type="text"&gt;&lt;br&gt;
  Email: &lt;input id="fbemail" type="text"&gt;&lt;br&gt;
  Rating: &lt;select id="fbrating"&gt;
    &lt;option value=""&gt;--Select--&lt;/option&gt;
    &lt;option&gt;5 - Excellent&lt;/option&gt;
    &lt;option&gt;4 - Good&lt;/option&gt;
    &lt;option&gt;3 - Average&lt;/option&gt;
  &lt;/select&gt;&lt;br&gt;
  Comments: &lt;textarea id="fbcomment" rows="3" cols="30"&gt;&lt;/textarea&gt;&lt;br&gt;
  &lt;p id="fberr" style="color:red"&gt;&lt;/p&gt;
  &lt;button type="submit"&gt;Submit&lt;/button&gt;
&lt;/form&gt;

&lt;script&gt;
function validateFeedback() {
  var name    = document.getElementById("fbname").value.trim();
  var email   = document.getElementById("fbemail").value.trim();
  var rating  = document.getElementById("fbrating").value;
  var comment = document.getElementById("fbcomment").value.trim();
  var errEl   = document.getElementById("fberr");

  if (!name) { errEl.textContent = "Name is required!"; return false; }

  var re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!re.test(email)) { errEl.textContent = "Invalid email!"; return false; }

  if (!rating) { errEl.textContent = "Please select a rating!"; return false; }

  if (comment.length &lt; 20) {
    errEl.textContent = "Comment must be at least 20 characters! (Current: " + comment.length + ")";
    return false;
  }
  errEl.textContent = "";
  alert("Feedback submitted! Thank you.");
  return true;
}
&lt;/script&gt;`,

  {
    id:56, tags:["js"],
    title:"Write a JavaScript program to perform area calculations of circle, rectangle, and triangle using functions and buttons.",
    explanation:`Math area formulas in JS. Uses <code>Math.PI</code> for π. Each shape has its own function. Good practice for multiple functions with different parameters.`,
    code:`Shape: &lt;select id="shapeSelect" onchange="showInputs()"&gt;
  &lt;option value=""&gt;--Select--&lt;/option&gt;
  &lt;option value="circle"&gt;Circle&lt;/option&gt;
  &lt;option value="rectangle"&gt;Rectangle&lt;/option&gt;
  &lt;option value="triangle"&gt;Triangle&lt;/option&gt;
&lt;/select&gt;
&lt;div id="shapeInputs"&gt;&lt;/div&gt;
&lt;p id="areaResult"&gt;&lt;/p&gt;

&lt;script&gt;
function showInputs() {
  var shape = document.getElementById("shapeSelect").value;
  var html = "";
  if (shape === "circle")
    html = "Radius: &lt;input id='r' type='number'&gt; &lt;button onclick='calcArea()'>Calculate&lt;/button&gt;";
  else if (shape === "rectangle")
    html = "Length: &lt;input id='l' type='number'&gt; Width: &lt;input id='w' type='number'&gt; &lt;button onclick='calcArea()'>Calculate&lt;/button&gt;";
  else if (shape === "triangle")
    html = "Base: &lt;input id='b' type='number'&gt; Height: &lt;input id='h' type='number'&gt; &lt;button onclick='calcArea()'>Calculate&lt;/button&gt;";
  document.getElementById("shapeInputs").innerHTML = html;
}
function calcArea() {
  var shape = document.getElementById("shapeSelect").value;
  var area;
  if (shape === "circle") { var r = parseFloat(document.getElementById("r").value); area = Math.PI * r * r; }
  else if (shape === "rectangle") { area = parseFloat(document.getElementById("l").value) * parseFloat(document.getElementById("w").value); }
  else if (shape === "triangle") { area = 0.5 * parseFloat(document.getElementById("b").value) * parseFloat(document.getElementById("h").value); }
  document.getElementById("areaResult").innerHTML = "Area = " + area.toFixed(4);
}
&lt;/script&gt;`,
    points:["Math.PI = 3.14159... built-in constant","Circle area = πr², Rectangle = l×w, Triangle = ½×b×h","Dynamic innerHTML lets you build inputs based on selection","onchange on select fires when dropdown value changes","toFixed(4) shows 4 decimal places for precision"]

  {
    id:59, tags:["php"],
    title:"Implement a PHP program for numeric operations such as finding factorial, palindrome number, and reverse number.",
    explanation:`PHP numeric algorithms. <b>Factorial</b>: multiply from 1 to n. <b>Palindrome</b>: reverse == original. <b>Reverse</b>: strrev() or loop. Commonly tested in college.`,
    code:`&lt;?php
// ---- FACTORIAL ----
function factorial($n) {
  if ($n == 0 || $n == 1) return 1;
  return $n * factorial($n - 1); // Recursive
}

// ---- REVERSE NUMBER ----
function reverseNum($n) {
  return (int) strrev((string) $n);
}

// ---- PALINDROME CHECK ----
function isPalindrome($n) {
  return $n == reverseNum($n);
}

// Test values
$nums = [5, 121, 123, 0, 7];

echo "&lt;table border='1' cellpadding='10' style='border-collapse:collapse'&gt;";
echo "&lt;tr style='background:#333;color:white'&gt;
        &lt;th&gt;Number&lt;/th&gt;&lt;th&gt;Factorial&lt;/th&gt;&lt;th&gt;Reversed&lt;/th&gt;&lt;th&gt;Palindrome?&lt;/th&gt;
      &lt;/tr&gt;";

foreach ($nums as $n) {
  $fact = ($n &lt;= 12) ? factorial($n) : "Too large";
  $rev  = reverseNum($n);
  $pal  = isPalindrome($n) ? "✅ Yes" : "❌ No";
  echo "&lt;tr&gt;&lt;td&gt;$n&lt;/td&gt;&lt;td&gt;$fact&lt;/td&gt;&lt;td&gt;$rev&lt;/td&gt;&lt;td&gt;$pal&lt;/td&gt;&lt;/tr&gt;";
}
echo "&lt;/table&gt;";
?&gt;`,
    points:["Recursive factorial: f(n) = n × f(n-1), base case f(0)=f(1)=1","strrev() reverses a string — cast int to string first","Palindrome: 121 reversed = 121 → same → palindrome","Ternary operator for inline conditional: cond ? true : false","PHP functions are defined with function name($params) { }"]
  },

// Render
function renderCards(filter = 'all', search = '') {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const filtered = practicals.filter(p => {
    const matchTag = filter === 'all' || p.tags.includes(filter);
    const matchSearch = search === '' || p.title.toLowerCase().includes(search.toLowerCase());
    return matchTag && matchSearch;
  });
  filtered.forEach(p => {
    const done = localStorage.getItem('p' + p.id) === '1';
    const card = document.createElement('div');
    card.className = 'card' + (done ? ' done' : '');
    card.id = 'card' + p.id;

    const tagHTML = p.tags.map(t => `<span class="tag ${t}">${t.toUpperCase()}</span>`).join('');
    card.innerHTML = `
      <div class="card-header" onclick="toggleCard(${p.id})">
        <span class="card-num">#${String(p.id).padStart(2,'0')}</span>
        <span class="card-title">${p.title}</span>
        <div class="tags">${tagHTML}</div>
        <button class="check-btn" onclick="event.stopPropagation(); toggleDone(${p.id})" title="Mark done">
          ${done ? '✓' : ''}
        </button>
        <span class="chevron">▼</span>
      </div>
      <div class="card-body">
        <div class="section-label">What & Why</div>
        <div class="explanation">${p.explanation}</div>
        <div class="section-label">Code</div>
        <pre><code>${p.code}</code><button class="copy-btn" onclick="copyCode(this)">COPY</button></pre>
        <div class="section-label">Key Points</div>
        <div class="key-points">${p.points.map(pt => `<div class="kp">${pt}</div>`).join('')}</div>
      </div>
    `;
    grid.appendChild(card);
  });
  updateProgress();
}

function toggleCard(id) {
  const card = document.getElementById('card' + id);
  card.classList.toggle('open');
}

function toggleDone(id) {
  const current = localStorage.getItem('p' + id) === '1';
  localStorage.setItem('p' + id, current ? '0' : '1');
  const card = document.getElementById('card' + id);
  if (card) {
    card.classList.toggle('done', !current);
    card.querySelector('.check-btn').innerHTML = !current ? '✓' : '';
  }
  updateProgress();
}

function updateProgress() {
  let done = 0;
  for (let i = 1; i <= 60; i++) { if (localStorage.getItem('p' + i) === '1') done++; }
  document.getElementById('pbar').style.width = (done / 60 * 100) + '%';
  document.getElementById('ptext').textContent = `${done} / 60 completed (${Math.round(done/60*100)}%)`;
}

function copyCode(btn) {
  const code = btn.previousElementSibling.textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'COPIED!';
    setTimeout(() => btn.textContent = 'COPY', 1500);
  });
}

// Filters
let activeFilter = 'all';
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderCards(activeFilter, document.getElementById('searchBox').value);
  });
});

document.getElementById('searchBox').addEventListener('input', e => {
  renderCards(activeFilter, e.target.value);
});

renderCards();
</script>
